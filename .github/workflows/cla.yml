# The contributor licence agreement (CLA.md): on a pull request whose author hasn't signed, the bot comments with the
# agreement and the sentence to post; posting it (or "recheck") records the signature in the cla-signatures branch, which
# must exist and stay unprotected. It never checks out or runs the pull request's code (pull_request_target runs this
# file from the default branch with a write token, so it must not), and no event text reaches a shell.
# Every action is pinned by its commit SHA, the release tag in the trailing comment.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contributor licence agreement
    if: >-
      github.repository == 'jdominick05/caminus' && (github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && (github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/jdominick05/caminus/blob/main/CLA.md
          branch: cla-signatures
          allowlist: jdominick05,dependabot[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thanks for the pull request! Before it can be merged, please read the
            [contributor licence agreement](https://github.com/jdominick05/caminus/blob/main/CLA.md) and, if you
            agree, sign it by posting the comment below. One signature covers all your future pull requests.
