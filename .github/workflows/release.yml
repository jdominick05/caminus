# The PyPI release (docs/RELEASING.md). The maintainer builds the wheel and sdist locally (tools/release_build.sh, the
# toolchain CI does not have) and attaches them with SHA256SUMS to a GitHub Release; publishing that Release (or running this
# workflow by hand with its tag) verifies the attached files against the tag and then waits for the `pypi` environment's
# required reviewer before anything is uploaded. Nothing here builds code objects.
# Every action is pinned by its commit SHA, the release tag in the trailing comment.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'the release tag (vX.Y.Z) whose attached files to verify and publish'
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify the Release's files against the tag
    if: github.repository == 'jdominick05/caminus'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: The tag has the form vX.Y.Z
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a release tag: '$TAG' (vX.Y.Z)"; exit 1
          fi

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: twine
        run: python -m pip install twine==6.1.0 'pkginfo>=1.12'

      - name: Download the Release's wheel, sdist and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/dist" \
             --pattern 'caminus-*.whl' --pattern 'caminus-*.tar.gz' --pattern SHA256SUMS
          ls -l "$RUNNER_TEMP/dist"

      - name: Verify (versions, SHA256SUMS, provenance == this commit, each code object == packaging/gfx1100-kernels.sha256)
        run: python -I tools/verify_release.py "$RUNNER_TEMP/dist" --tag "$TAG"

      - name: twine check
        run: python -m twine check --strict "$RUNNER_TEMP"/dist/caminus-*

      - name: Hand the verified files to the publish job
        run: |
          mkdir -p "$RUNNER_TEMP/publish"
          cp "$RUNNER_TEMP"/dist/caminus-*.whl "$RUNNER_TEMP"/dist/caminus-*.tar.gz "$RUNNER_TEMP/publish/"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: ${{ runner.temp }}/publish/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to PyPI (after the pypi environment's reviewer approves)
    needs: verify
    if: github.repository == 'jdominick05/caminus'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/caminus/
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: The files to upload
        run: ls -l dist/ && sha256sum dist/*

      - uses: pypa/gh-action-pypi-publish@7f25271a4aa483500f742f9492b2ab5648d61011 # v1.12.4
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          attestations: false
          print-hash: true
