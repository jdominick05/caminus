name: Feature request
description: Ask for a model, a card, a tool, or anything else.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: want
    attributes:
      label: What you'd like
      description: What should Caminus do, and what would you use it for?
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: What you do today
      description: How do you work around it now, if at all?
    validations:
      required: false
  - type: input
    id: cards
    attributes:
      label: Your cards (optional)
    validations:
      required: false
